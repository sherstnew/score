<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scores.css">
    <script src="scores.js" defer></script>
    <title>Панель управления табло</title>
</head>
<body>
    <form class="scores">
        <header class="header">
            <div>
                <h1>Панель управления матчем</h1>
            </div>
            <label class="game_id">
                <span>ID матча</span>
                <input type="number" class="input" id="gameid" required value="1">
            </label>
        </header>

        <section class="panel sets_panel" aria-label="Счет по партиям">
            <div class="panel_header">
                <h2>Счет по партиям</h2>
            </div>
            <div class="sets_scores">
                <div class="set_score">
                    <span>1 партия</span>
                    <input type="number" class="input set_score_part" min="0" placeholder="А">
                    <strong>:</strong>
                    <input type="number" class="input set_score_part" min="0" placeholder="Б">
                </div>
                <div class="set_score">
                    <span>2 партия</span>
                    <input type="number" class="input set_score_part" min="0" placeholder="А">
                    <strong>:</strong>
                    <input type="number" class="input set_score_part" min="0" placeholder="Б">
                </div>
                <div class="set_score">
                    <span>3 партия</span>
                    <input type="number" class="input set_score_part" min="0" placeholder="А">
                    <strong>:</strong>
                    <input type="number" class="input set_score_part" min="0" placeholder="Б">
                </div>
                <div class="set_score">
                    <span>4 партия</span>
                    <input type="number" class="input set_score_part" min="0" placeholder="А">
                    <strong>:</strong>
                    <input type="number" class="input set_score_part" min="0" placeholder="Б">
                </div>
                <div class="set_score">
                    <span>5 партия</span>
                    <input type="number" class="input set_score_part" min="0" placeholder="А">
                    <strong>:</strong>
                    <input type="number" class="input set_score_part" min="0" placeholder="Б">
                </div>
            </div>
        </section>

        <section class="teams" aria-label="Команды">
            <div class="team team_a">
                <header class="team_header">Команда А</header>

                <label class="field">
                    <span>Название</span>
                    <input type="text" placeholder="Название команды А" class="input" id="name_a" required value="Академия">
                </label>

                <label class="field">
                    <span>Логотип</span>
                    <div class="logo_picker">
                        <select class="input" id="logo_a" required>
                            <option value="Академия.png" selected>Академия</option>
                            <option value="Весна.png">Весна</option>
                            <option value="Водоканал.png">Водоканал</option>
                            <option value="Заречье.png">Заречье</option>
                            <option value="Легион.png">Легион</option>
                            <option value="Олимп_ДМД.png">Олимп ДМД</option>
                            <option value="Пахра_Истина.png">Пахра Истина</option>
                            <option value="Подолье.png">Подолье</option>
                            <option value="Силик.png">Силик</option>
                            <option value="СШОР_Пахра.png">СШОР Пахра</option>
                            <option value="Юность.png">Юность</option>
                        </select>
                        <img src="./images/teamlogos/Академия.png" alt="Логотип команды А" class="logo_preview" id="logo_a_preview">
                    </div>
                </label>

                <div class="score_controls">
                    <div class="team_block">
                        <label for="point_a">Очки</label>
                        <div class="counter">
                            <button type="button" class="btn btn_remove" id="point_a_remove">-</button>
                            <input type="number" id="point_a" class="input input_point" placeholder="Очки" value="0" min="0">
                            <button type="button" class="btn btn_add" id="point_a_add">+</button>
                        </div>
                    </div>
                    <div class="team_block">
                        <label for="set_a">Партии</label>
                        <div class="counter">
                            <button type="button" class="btn btn_remove" id="set_a_remove">-</button>
                            <input type="number" id="set_a" class="input input_set" placeholder="Партии" value="0">
                            <button type="button" class="btn btn_add" id="set_a_add">+</button>
                        </div>
                    </div>
                </div>

                <label class="timeout">
                    <input type="checkbox" name="timeout_a" id="timeout_a">
                    <span>Тайм-аут команды А</span>
                </label>
            </div>

            <div class="team team_b">
                <header class="team_header">Команда Б</header>

                <label class="field">
                    <span>Название</span>
                    <input type="text" placeholder="Название команды Б" class="input" id="name_b" required>
                </label>

                <label class="field">
                    <span>Логотип</span>
                    <div class="logo_picker">
                        <select class="input" id="logo_b" required>
                            <option value="Академия.png">Академия</option>
                            <option value="Весна.png" selected>Весна</option>
                            <option value="Водоканал.png">Водоканал</option>
                            <option value="Заречье.png">Заречье</option>
                            <option value="Легион.png">Легион</option>
                            <option value="Олимп_ДМД.png">Олимп ДМД</option>
                            <option value="Пахра_Истина.png">Пахра Истина</option>
                            <option value="Подолье.png">Подолье</option>
                            <option value="Силик.png">Силик</option>
                            <option value="СШОР_Пахра.png">СШОР Пахра</option>
                            <option value="Юность.png">Юность</option>
                        </select>
                        <img src="./images/teamlogos/Весна.png" alt="Логотип команды Б" class="logo_preview" id="logo_b_preview">
                    </div>
                </label>

                <div class="score_controls">
                    <div class="team_block">
                        <label for="point_b">Очки</label>
                        <div class="counter">
                            <button type="button" class="btn btn_remove" id="point_b_remove">-</button>
                            <input type="number" id="point_b" class="input input_point" placeholder="Очки" value="0" min="0">
                            <button type="button" class="btn btn_add" id="point_b_add">+</button>
                        </div>
                    </div>
                    <div class="team_block">
                        <label for="set_b">Партии</label>
                        <div class="counter">
                            <button type="button" class="btn btn_remove" id="set_b_remove">-</button>
                            <input type="number" id="set_b" class="input input_set" placeholder="Партии" value="0">
                            <button type="button" class="btn btn_add" id="set_b_add">+</button>
                        </div>
                    </div>
                </div>

                <label class="timeout">
                    <input type="checkbox" name="timeout_b" id="timeout_b">
                    <span>Тайм-аут команды Б</span>
                </label>
            </div>
        </section>

        <section class="actions" aria-label="Действия">
            <button type="submit" class="btn btn_submit" id="submit_btn">Сохранить</button>
            <div class="btn btn_clear" id="reset_btn" role="button" tabindex="0">Новая партия</div>
        </section>
    </form>
</body>
</html>
